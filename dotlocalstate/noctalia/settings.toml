config_version = 2

[backdrop]
enabled = true
tint_intensity = 0.75

[bar.default]
background_opacity = 0.75
center = [ "notifications", "workspaces" ]
end = [
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "clock"
]
icon_color = "primary"
margin_ends = 5
start = [ "caffeine", "launcher", "cpu", "ram", "network_rx", "network_tx", "media" ]

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 128.0
    box_width = 1536.0
    cx = 768.0
    cy = 960.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_padding = 10
        bands = 32
        centered = false
        mirrored = true
        show_when_idle = false

[dock]
auto_hide = true
background_opacity = 0.25
enabled = true
launcher_position = "start"
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "LOCATION"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000005",
    "lockscreen-widget-0000000000000006",
    "lockscreen-widget-0000000000000007",
    "lockscreen-widget-0000000000000008",
    "lockscreen-widget-0000000000000009",
    "lockscreen-widget-000000000000000a"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 905.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 480.0
    cx = 768.0
    cy = 256.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 112.0
    box_width = 1536.0
    cx = 768.0
    cy = 968.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        bands = 32
        centered = false
        color_1 = "primary"
        show_when_idle = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 64.0
    box_width = 64.0
    cx = 608.0
    cy = 694.0
    output = "eDP-1"
    rotation = -0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        display = "gauge"
        gauge_layout = "vertical"
        shadow = false
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 64.0
    box_width = 64.0
    cx = 672.0
    cy = 694.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        display = "gauge"
        gauge_layout = "vertical"
        shadow = false
        stat = "cpu_temp"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 64.0
    box_width = 64.0
    cx = 736.0
    cy = 694.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        display = "gauge"
        gauge_layout = "vertical"
        shadow = false
        stat = "ram_pct"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000006]
    box_height = 64.0
    box_width = 64.0
    cx = 800.0
    cy = 694.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000006.settings]
        display = "gauge"
        gauge_layout = "vertical"
        shadow = false
        stat = "swap_pct"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000007]
    box_height = 64.0
    box_width = 64.0
    cx = 864.0
    cy = 694.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000007.settings]
        background = true
        display = "gauge"
        gauge_layout = "vertical"
        network_speed_compact = false
        shadow = false
        show_label = true
        stat = "net_rx"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000008]
    box_height = 64.0
    box_width = 64.0
    cx = 928.0
    cy = 694.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000008.settings]
        background = true
        display = "gauge"
        gauge_layout = "vertical"
        shadow = false
        stat = "net_tx"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000009]
    box_height = 224.0
    box_width = 336.0
    cx = 784.0
    cy = 480.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000009.settings]
        background = false
        background_radius = 10
        show_forecast = true

    [lockscreen_widgets.widget.lockscreen-widget-000000000000000a]
    box_height = 144.0
    box_width = 384.0
    cx = 768.0
    cy = 798.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

[osd]
enabled = false

[shell]
external_ip_enabled = true
offline_mode = false
popup_shadows = false

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    open_near_click_session = true
    polkit_placement = "attached"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/USERNAME/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/USERNAME/Pictures/Wallpapers/wallpaper_desktop.jpg"

    [wallpaper.last]
    path = "/home/USERNAME/Pictures/Wallpapers/wallpaper_desktop.jpg"

[widget.cpu]
display = "text"

[widget.network_rx]
display = "text"

[widget.network_tx]
display = "text"

[widget.ram]
display = "text"
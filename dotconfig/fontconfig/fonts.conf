<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- ====================================================== -->
  <!--               1. 核心：调整回退(Fallback)顺序            -->
  <!-- ====================================================== -->

  <!-- 针对等宽字体 (终端、代码编辑器) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <!-- 第一顺位：英文数字用 Noto Mono -->
      <family>Noto Sans Mono</family>
      <!-- 第二顺位：中文强制用思源黑体 -->
      <family>Noto Sans CJK SC</family>
      <!-- 更纱黑体 -->
      <family>Sarasa Mono SC</family>
      <!-- 最后：才轮到 Windows 的字体兜底 -->
      <family>Consolas</family>
      <family>Courier New</family>
      <family>SimSun</family> <!-- 宋体/NSimSun -->
      <family>MS Gothic</family>
    </prefer>
  </alias>

  <!-- 针对无衬线字体 (系统界面、网页) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Microsoft YaHei</family> <!-- 只有当前面都没有时，才用雅黑 -->
    </prefer>
  </alias>

  <!-- 针对衬线字体 (办公软件文档正文) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <!-- 保证办公软件能找到宋体，但 Linux 系统界面尽量不用它 -->
      <family>SimSun</family> 
    </prefer>
  </alias>

  <!-- ====================================================== -->
  <!--               2. 优化：整治 Windows 字体显示效果          -->
  <!-- ====================================================== -->
  
  <!-- 强制关闭 Windows 字体的点阵位图 (消除锯齿感) -->
  <match target="font">
    <test name="family" compare="contains">
      <string>SimSun</string>
    </test>
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  
  <!-- 对 MS Gothic 也做同样处理，防止日文显示锯齿 -->
  <match target="font">
    <test name="family" compare="contains">
      <string>MS Gothic</string>
    </test>
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

</fontconfig>
